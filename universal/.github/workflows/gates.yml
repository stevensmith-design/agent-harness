name: gates
# GENERATED by scripts/ci-gen.sh from harness.config.yaml. Run 'make ci-gen'
# after changing the pipeline; CI fails if this file drifts from the config.
#
# Product checks run on every change. Harness-governance checks live in the
# separate harness.yml workflow and run only when harness-owned paths change.

on:
  pull_request:
  push:
    branches: [main]

# Least privilege. A job needing more grants it on itself, visibly in the diff.
permissions:
  contents: read

concurrency:
  group: gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secret scan
        run: ./scripts/gates/secret-scan.sh

  toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up toolchain
        run: echo "TODO - add your stack setup step in scripts/adapters/generic.sh"
      - run: make deps
      - run: make check

  pr-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: PR description must carry verification evidence
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: ./scripts/ci/pr-body.sh
