name: harness
# GENERATED by scripts/ci-gen.sh. Ordinary product changes do not run this.

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'Makefile'
      - 'harness.config.yaml'
      - '.agents/**'
      - '.claude/**'
      - '.cursor/**'
      - '.github/instructions/**'
      - '.github/workflows/**'
      - '.githooks/**'
      - '.harness/**'
      - 'scripts/**'
      - 'overlays/**'
      - 'evals/**'

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run harness governance
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: make harness-check
